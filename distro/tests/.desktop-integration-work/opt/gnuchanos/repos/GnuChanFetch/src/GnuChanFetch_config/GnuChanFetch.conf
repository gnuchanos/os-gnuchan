# GnuChanFetch settings. Lines use the same Key = value format as system.conf.
Version = "0.1.0"
Image = "~/.config/GnuChanFetch/logo.png"
ImageRows = 16
Gap = 3
ImageBackground = "#0b0310"
Fields = [
    "model",
    "user",
    "host",
    "os",
    "kernel",
    "server",
    "uptime",
    "packages",
    "shell",
    "wm",
    "dm",
    "theme",
    "icons",
    "cursor",
    "terminal",
    "cpu",
    "gpu",
    "memory",
    "disk",
]
Colours = [
    "#0b0310",
    "#32143f",
    "#542080",
    "#6d28d9",
    "#9333ea",
    "#a855f7",
    "#c77dff",
    "#d8a4ff",
]

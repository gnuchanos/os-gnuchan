# GnuChanTerm settings. Each active setting is a Key = value line.
# Values omitted here keep the terminal's built-in defaults.

Font = "monospace-11"
Prompt = "\[\e[38;5;135m\]\u@\h\[\e[0m\]:\[\e[38;5;183m\]\w\[\e[0m\]\$ "

# ANSI colors 0–15, then the terminal's own text and background at 16–17.
Color0 = "#16051f"
Color1 = "#8b2fc9"
Color2 = "#9d3fe0"
Color3 = "#b14cff"
Color4 = "#7b2cbf"
Color5 = "#c05cff"
Color6 = "#a83ee6"
Color7 = "#c77dff"
Color8 = "#54206f"
Color9 = "#b65cff"
Color10 = "#9635d0"
Color11 = "#d08aff"
Color12 = "#a946e8"
Color13 = "#c77dff"
Color14 = "#b967f5"
Color15 = "#d28cff"
Color16 = "#c98cff"
Color17 = "#0b0310"

BarBackground = "#09030d"
BarForeground = "#ddb3ff"
Cursor = "#ddb3ff"

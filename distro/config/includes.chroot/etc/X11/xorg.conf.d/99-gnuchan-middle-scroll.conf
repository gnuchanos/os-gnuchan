# GnuchanOS - press and move the middle mouse button to scroll.
#
# Keep this to physical pointers; touchpads retain their two-finger scrolling
# configuration from 90-gnuchan-touchpad.conf.
Section "InputClass"
    Identifier "GnuchanOS middle-button scrolling"
    MatchIsPointer "on"
    MatchIsTouchpad "off"
    Driver "libinput"
    Option "ScrollMethod" "button"
    Option "ScrollButton" "2"
EndSection
